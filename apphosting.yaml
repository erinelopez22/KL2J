# Firebase App Hosting runtime configuration.
# Vite bakes VITE_* vars into the browser bundle at build time by reading the
# committed .env file directly, so those don't need to be listed here. But
# non-VITE_ vars read via process.env in server code (e.g. requireSupabaseAuth
# middleware) are NOT loaded from .env at runtime in production — Cloud Run's
# process environment only has what's declared below.
env:
  # Public, non-secret values (same as in the committed .env) — plain value,
  # not a secret reference.
  - variable: SUPABASE_URL
    value: "https://asggvunieersxjpkhiod.supabase.co"
  - variable: SUPABASE_PUBLISHABLE_KEY
    value: "sb_publishable_1UbfdLhJ4FN3VqqPssRJeQ_TmNAJ_ni"
  # Secrets, created via `firebase apphosting:secrets:set` — reference by name,
  # value stays in Secret Manager rather than plaintext here.
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
  # Outgoing email (all app mail — inquiry notifications, post announcements,
  # etc.) goes through Brevo's API rather than Gmail SMTP, since a personal
  # Gmail account risks getting rate-limited/flagged for this kind of volume.
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
  - variable: GOOGLE_GBP_CLIENT_ID
    secret: GOOGLE_GBP_CLIENT_ID
  - variable: GOOGLE_GBP_CLIENT_SECRET
    secret: GOOGLE_GBP_CLIENT_SECRET
  # Shared secret Cloud Scheduler sends as `Authorization: Bearer <value>`
  # when it hits /api/cron/process-email-queue — see src/routes/api/cron/process-email-queue.ts.
  - variable: CRON_SECRET
    secret: CRON_SECRET
